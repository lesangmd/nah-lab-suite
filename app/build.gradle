plugins { id 'com.android.application' }

android {
    namespace 'vn.nah.iso15189suite'
    buildFeatures { buildConfig true }
    compileSdk 35

    defaultConfig {
        applicationId 'vn.nah.iso15189suite'
        minSdk 26
        targetSdk 35
        versionCode 11015
        versionName '1.1.15'
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

