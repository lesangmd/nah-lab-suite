name: Windows v1.3.28 Web v1.58.58 candidate (UNSIGNED, HOLD)
on:
  push:
    branches:
      - release/windows-v1.3.28-web-v1.58.58-rc
    paths:
      - "tools/prepare-windows-v1.3.28.py"
      - "tools/windows-v1.3.28-webdiff.b64"
      - ".github/workflows/windows-v1.3.28-candidate.yml"
      - ".github/workflows/release-windows-1.3.27-manual.yml"
      - "native/windows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-v1328-unsigned-hold:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Preserve LF hashes during checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify unchanged Android and Windows v1.58.56 staging baseline
        shell: pwsh
        run: |
          python -X utf8 tools/verify-source-release.py
          if ($LASTEXITCODE -ne 0) { throw 'Baseline release check failed' }
          python -X utf8 tools/verify-native-parity.py
          if ($LASTEXITCODE -ne 0) { throw 'Baseline parity check failed' }
      - name: Reconstruct canonical Web 1.58.58 Windows source
        shell: pwsh
        run: |
          python -X utf8 tools/prepare-windows-v1.3.28.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows 1.3.28 patch or SHA-256 verification failed' }
          python -X utf8 tools/prepare-windows-v1.3.28.py
          if ($LASTEXITCODE -ne 0) { throw 'Preparation is not idempotent' }
      - name: Validate Web JS and Win32 resource metadata
        shell: pwsh
        run: |
          node --check native/windows/offline/assets/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript v1.58.58 syntax invalid' }
          python -m py_compile native/windows/MAKE-RESOURCES.py
          if ($LASTEXITCODE -ne 0) { throw 'Resource metadata invalid' }
      - name: Discover LLVM tools
        shell: pwsh
        run: |
          $llvm='C:\Program Files\LLVM\bin'
          if (-not (Get-Command clang.exe -ErrorAction SilentlyContinue) -or -not (Get-Command lld-link.exe -ErrorAction SilentlyContinue)) {
            if (Test-Path (Join-Path $llvm 'clang.exe')) {
              $env:PATH = "$llvm;$env:PATH"
              $llvm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          if (-not (Get-Command clang.exe -ErrorAction SilentlyContinue)) { throw 'LLVM clang missing' }
          if (-not (Get-Command lld-link.exe -ErrorAction SilentlyContinue)) { throw 'LLVM lld-link missing' }
      - name: Compile Windows Native v1.3.28 x64
        shell: cmd
        working-directory: native/windows
        run: BUILD-X64.cmd
      - name: Verify binary version and package complete unsigned candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $PWD 'native/windows'
          $exe=Join-Path $src 'NAH-LAB-SUITE.exe'
          $version=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion
          if ($version -notmatch '^1\.3\.28(?:\.0)?$') { throw "Unexpected EXE version: $version" }
          $dst=Join-Path $PWD 'publish/NAH-LAB-SUITE-Windows-v1.3.28'
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          foreach ($n in @('NAH-LAB-SUITE.exe','NAH-UPDATE.ps1','NAH-UPDATE.cmd','INSTALL-OR-UPDATE.ps1','INSTALL-OR-UPDATE.cmd','signer-baseline.json')) {
            $p=Join-Path $src $n
            if (-not (Test-Path $p)) { throw "Missing package component $n" }
            Copy-Item -LiteralPath $p -Destination $dst
          }
          Copy-Item -LiteralPath (Join-Path $src 'offline') -Destination $dst -Recurse
          "UNSIGNED QA ONLY; WEB 1.58.58; NO AUTO UPDATE; NO PUBLIC RELEASE. Backup WebView2 user data before device testing." | Set-Content (Join-Path $dst 'README-HOLD.txt') -Encoding UTF8
          $sha=@(Get-ChildItem $dst -Recurse -File | ForEach-Object { [pscustomobject]@{name=$_.FullName.Substring($dst.Length+1).Replace('\','/');sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} })
          $sha | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $dst 'SHA256-FILES.json') -Encoding UTF8
          Compress-Archive -Path $dst -DestinationPath 'publish/NAH-LabSuite-Windows-v1.3.28-Web-v1.58.58-UNSIGNED-HOLD.zip' -CompressionLevel Optimal -Force
          Get-FileHash 'publish/NAH-LabSuite-Windows-v1.3.28-Web-v1.58.58-UNSIGNED-HOLD.zip' -Algorithm SHA256 | Format-List | Out-File 'publish/ZIP-SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-v1.3.28-Web-v1.58.58-UNSIGNED-HOLD
          path: publish/
          if-no-files-found: error
          retention-days: 14
