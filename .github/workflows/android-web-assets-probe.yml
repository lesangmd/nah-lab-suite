name: NAH Android v1.1.17 Web asset parity probe
on:
  push:
    branches: [release/android-v1.1.17-web-v1.58.94-edge-qa]
    paths:
      - '.github/workflows/android-web-assets-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-live-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download live nonprivate WebApp assets for exact comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          import hashlib,json
          u='https://www.sachyhoc.com/wp-content/plugins/nah-iso15189-suite_/assets/'
          output={}
          for name in ['app.js','app.css','service-worker.js']:
              req=Request(u+name,headers={'User-Agent':'NAH-LabSuite-AssetParity/1.1.17','Cache-Control':'no-cache'})
              with urlopen(req,timeout=90) as r: b=r.read()
              with open('publish/'+name,'wb') as f:f.write(b)
              output[name]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          with open('publish/SHA256-ASSETS.json','w') as f:json.dump(output,f,indent=2)
          print(output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NAH-Web-v1.58.94-Live-Asset-Diagnostic
          path: publish/
          if-no-files-found: error
          retention-days: 3
