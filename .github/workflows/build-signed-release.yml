name: Build NAH LabSuite signed Android release — new baseline 1.1.15

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Expected versionName"
        required: true
        default: "1.1.15"
      release_version_code:
        description: "Expected versionCode"
        required: true
        default: "11015"

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.release_version || '1.1.15' }}
      RELEASE_VERSION_CODE: ${{ inputs.release_version_code || '11015' }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      KS_B64: ${{ secrets.NAH_ANDROID_KEYSTORE_B64 }}
      KS_ALIAS: ${{ secrets.NAH_ANDROID_KEY_ALIAS }}
      KS_PASS: ${{ secrets.NAH_ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASS: ${{ secrets.NAH_ANDROID_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.NAH_ANDROID_CERT_SHA256 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Require persistent NAH signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KS_B64"
          test -n "$KS_ALIAS"
          test -n "$KS_PASS"
          test -n "$KEY_PASS"
          test -n "$EXPECTED_CERT_SHA256"
          BASELINE_CERT=$(python3 -c 'import json; print(json.load(open("signing-baseline.json"))["certificateSha256"])')
          PROVIDED_CERT=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          test "$PROVIDED_CERT" = "$BASELINE_CERT"
          test "$BASELINE_CERT" = "76a2a3289bd26bc255caa3465f609a1b83992b3f4fe0b44813e67296e01d52ac"
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "Persistent signing secret gate PASS"

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$RELEASE_VERSION"
          EXPECTED_CODE="$RELEASE_VERSION_CODE"
          grep -q "applicationId 'vn.nah.iso15189suite'" app/build.gradle
          grep -q "versionName '$EXPECTED_VERSION'" app/build.gradle
          grep -Eq "^ *versionCode ${EXPECTED_CODE}$" app/build.gradle
          python3 tools/verify-source-release.py

      - name: Restore persistent NAH release keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nah-signing
          printf '%s' "$KS_B64" | base64 -d > /tmp/nah-signing/NAH-Android-Release.jks
          test -s /tmp/nah-signing/NAH-Android-Release.jks
          keytool -list             -keystore /tmp/nah-signing/NAH-Android-Release.jks             -alias "$KS_ALIAS"             -storepass "$KS_PASS" >/dev/null
          keytool -exportcert -alias "$KS_ALIAS" -keystore /tmp/nah-signing/NAH-Android-Release.jks -storetype PKCS12 -storepass "$KS_PASS" -file /tmp/nah-signing/cert.der >/dev/null
          CERT_HASH=$(sha256sum /tmp/nah-signing/cert.der | awk '{print           keytool -list             -keystore /tmp/nah-signing/NAH-Android-Release.jks             -alias "$KS_ALIAS"             -storepass "$KS_PASS" >/dev/null
}')
          EXPECTED_HASH=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          test "$CERT_HASH" = "$EXPECTED_HASH"
          cmp /tmp/nah-signing/cert.der release-certificate.der

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile unsigned release
        run: gradle :app:assembleRelease --no-daemon

      - name: Align and sign with permanent NAH identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          VERSION="$RELEASE_VERSION"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=/tmp/NAH-LAB-SUITE-aligned.apk
          SIGNED="out/NAH-LAB-SUITE-Android-v${VERSION}-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks /tmp/nah-signing/NAH-Android-Release.jks             --ks-key-alias "$KS_ALIAS"             --ks-pass env:KS_PASS             --key-pass env:KEY_PASS             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out "$SIGNED"             "$ALIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify             --verbose             --print-certs             "$SIGNED" | tee out/apksigner-verify.txt

          CERT_SHA=$(
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$SIGNED" |
            awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}' |
            tr -d '[:space:]'
          )
          EXPECTED=$(
            printf '%s' "$EXPECTED_CERT_SHA256" |
            tr '[:upper:]' '[:lower:]' |
            tr -d ':[:space:]'
          )

          test -n "$CERT_SHA"
          test "$CERT_SHA" = "$EXPECTED"

          printf '%s\n' "$CERT_SHA" > out/NAH-ANDROID-RELEASE-CERT-SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$SIGNED" > out/zipalign-verify.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SIGNED" > out/aapt-badging.txt
          sha256sum "$SIGNED" > "out/NAH-LAB-SUITE-Android-v${VERSION}-release.apk.sha256"

      - name: Remove restored private keystore
        if: always()
        run: rm -rf /tmp/nah-signing

      - uses: actions/upload-artifact@v4
        with:
          name: nah-lab-android-signed-release
          path: out/
          if-no-files-found: error
          retention-days: 14

