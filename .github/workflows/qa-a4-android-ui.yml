name: QA - A4 forms and transparent Android system bars (HOLD)

on:
  push:
    branches:
      - fix/iso-a4-docx-android-status-bars-20261101
    paths:
      - 'app/**'
      - 'webapp/**'
      - 'native/windows/**'
      - 'tools/validate-a4-system-bars.cjs'
      - '.github/workflows/qa-a4-android-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static document and native UI checks
        run: node tools/validate-a4-system-bars.cjs
      - name: Non-release Native mirror and template catalogue check
        run: python3 tools/verify-native-parity.py

  android-unsigned-compile:
    runs-on: ubuntu-latest
    needs: qa-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile unsigned Android APK for QA only
        run: gradle :app:assembleDebug --no-daemon

# IMPORTANT:
# This is an unsigned, source-only QA workflow. It never signs, publishes,
# changes production Web v1.58.59, or overrides the pinned release checks in
# validate-source.yml / verify-source-release.py. Final release stays HOLD.
