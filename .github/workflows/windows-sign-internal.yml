name: Windows 1.3.27 internal signing (HOLD)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  internal-candidate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      WIN_PFX_B64: ${{ secrets.NAH_WINDOWS_PFX_B64 }}
      WIN_PFX_PASS: ${{ secrets.NAH_WINDOWS_PFX_PASSWORD }}
      WIN_THUMB: ${{ secrets.NAH_WINDOWS_CERT_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require complete and consistent Native source
        shell: pwsh
        run: |
          python -X utf8 tools/verify-source-release.py
          if ($LASTEXITCODE -ne 0) { throw 'Source release gate failed' }
          python -X utf8 tools/verify-native-parity.py
          if ($LASTEXITCODE -ne 0) { throw 'Cross-platform parity gate failed' }
      - name: Check prerequisites and trust policy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Test-Path 'native/windows/native_webview2.c') -or -not (Test-Path 'native/windows/BUILD-X64.cmd')) { throw 'HOLD: full Windows source not synced' }
          if (-not $env:WIN_PFX_B64 -or -not $env:WIN_PFX_PASS -or -not $env:WIN_THUMB) { throw 'HOLD: signing secrets not configured' }
          $meta=Get-Content 'native/windows/signer-baseline.json' -Raw | ConvertFrom-Json
          if ($meta.certificateThumbprintSha1 -ne $env:WIN_THUMB.ToUpperInvariant()) { throw 'HOLD: signer mismatch' }
          if ($meta.publiclyTrusted -ne $false -or $meta.releaseReady -ne $false) { throw 'HOLD: unexpected public release flag' }
      - name: Discover LLVM build tools
        shell: pwsh
        run: |
          $clang=(Get-Command clang.exe -ErrorAction SilentlyContinue)
          $lld=(Get-Command lld-link.exe -ErrorAction SilentlyContinue)
          if (-not $clang -or -not $lld) {
            $llvm='C:\Program Files\LLVM\bin'
            if (Test-Path (Join-Path $llvm 'clang.exe')) { $env:PATH = "$llvm;$env:PATH"; $llvm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }
          if (-not (Get-Command clang.exe -ErrorAction SilentlyContinue)) { throw 'clang.exe not installed' }
          if (-not (Get-Command lld-link.exe -ErrorAction SilentlyContinue)) { throw 'lld-link.exe not installed' }
      - name: Compile Windows x64
        shell: cmd
        working-directory: native/windows
        run: BUILD-X64.cmd
      - name: Sign EXE with internal-only Authenticode identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pfx=Join-Path $env:RUNNER_TEMP 'NAH-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:WIN_PFX_B64))
            $exe=Join-Path $PWD 'native/windows/NAH-LAB-SUITE.exe'
            $pw=ConvertTo-SecureString $env:WIN_PFX_PASS -AsPlainText -Force
            $cert=Import-PfxCertificate -FilePath $pfx -Password $pw -CertStoreLocation Cert:\CurrentUser\My
            if ($cert.Thumbprint -ne $env:WIN_THUMB.ToUpperInvariant()) { throw 'HOLD: wrong PFX cert' }
            $tool=Get-ChildItem -Path (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin') -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1 -ExpandProperty FullName
            if (-not $tool) { throw 'signtool.exe not available' }
            & $tool sign /fd SHA256 /sha1 $env:WIN_THUMB /s My /tr 'http://timestamp.digicert.com' /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
            $got=(Get-AuthenticodeSignature -FilePath $exe).SignerCertificate
            if (-not $got -or $got.Thumbprint -ne $env:WIN_THUMB.ToUpperInvariant()) { throw 'EXE signer mismatch' }
            $update=Join-Path $PWD 'native/windows/NAH-UPDATE.ps1'
            $scriptSig=Set-AuthenticodeSignature -FilePath $update -Certificate $cert -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
            if (-not $scriptSig.SignerCertificate -or $scriptSig.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $env:WIN_THUMB.ToUpperInvariant()) { throw 'Updater script signing failed' }
            'SELF-SIGNED INTERNAL SIGNER. NOT PUBLICLY TRUSTED.' | Set-Content 'native/windows/INTERNAL-TRUST-REQUIRED.txt'
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            if ($env:WIN_THUMB) { Remove-Item ("Cert:\CurrentUser\My\" + $env:WIN_THUMB) -Force -ErrorAction SilentlyContinue }
          }
      - name: Package complete Windows x64 offline candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $PWD 'native/windows'
          $dst=Join-Path $PWD 'publish/NAH-LAB-SUITE-Windows-v1.3.27'
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          foreach ($n in @('NAH-LAB-SUITE.exe','NAH-UPDATE.ps1','NAH-UPDATE.cmd','INSTALL-OR-UPDATE.ps1','INSTALL-OR-UPDATE.cmd','signer-baseline.json','public-internal-codesign.crt','INTERNAL-TRUST-REQUIRED.txt')) {
            $p=Join-Path $src $n
            if (-not (Test-Path $p)) { throw "Missing signed release component $n" }
            Copy-Item -LiteralPath $p -Destination $dst
          }
          Copy-Item -LiteralPath (Join-Path $src 'offline') -Destination $dst -Recurse
          $sha=@(Get-ChildItem $dst -Recurse -File | ForEach-Object { [pscustomobject]@{name=$_.FullName.Substring($dst.Length+1).Replace('\','/');sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} })
          $sha | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $dst 'SHA256-FILES.json') -Encoding UTF8
          $zip='publish/NAH-LabSuite-Windows-v1.3.27-Web-v1.58.56-INTERNAL-SIGNED-HOLD.zip'
          Compress-Archive -Path $dst -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-FileHash $zip -Algorithm SHA256 | Format-List | Out-File 'publish/ZIP-SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-v1.3.27-INTERNAL-ONLY-NO-AUTO-UPDATE
          path: publish/
          if-no-files-found: error
          retention-days: 7
