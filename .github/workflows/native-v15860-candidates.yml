name: NAH Native - Windows 1.3.29 and Android 1.1.16 / Web 1.58.60 (INTERNAL HOLD)
on:
  push:
    branches:
      - release/nah-native-v15860-candidates-20261103
    paths:
      - 'tools/prepare-native-web15860.py'
      - 'tools/validate-a4-system-bars.cjs'
      - 'app/src/main/java/vn/nah/iso15189suite/MainActivity.java'
      - '.github/workflows/native-v15860-candidates.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify-web-and-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage exact Web 1.58.60 from published canonical plugin
        run: python3 tools/prepare-native-web15860.py
      - name: Static and version identity gates
        run: |
          set -euo pipefail
          node tools/validate-a4-system-bars.cjs
          python3 tools/verify-native-parity.py
          node --check native/windows/offline/assets/app.js
          node --check app/src/main/assets/offline/assets/app.js
          grep -q "versionName '1.1.16'" app/build.gradle
          grep -q "versionCode 11016" app/build.gradle
          grep -q '1.58.60' native/windows/offline/index.html
          grep -q '1.58.60' app/src/main/assets/offline/index.html
          python3 tools/prepare-native-web15860.py
          echo 'PASS: pinned assets, idempotent staging, signer identity and interface parity'

  android-signed-internal-hold:
    runs-on: ubuntu-latest
    needs: verify-web-and-native
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      KS_B64: ${{ secrets.NAH_ANDROID_KEYSTORE_B64 }}
      KS_ALIAS: ${{ secrets.NAH_ANDROID_KEY_ALIAS }}
      KS_PASS: ${{ secrets.NAH_ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASS: ${{ secrets.NAH_ANDROID_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.NAH_ANDROID_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct pinned v1.58.60 native assets
        run: python3 tools/prepare-native-web15860.py
      - name: Fail closed unless original Android signing key is available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KS_B64" && test -n "$KS_ALIAS" && test -n "$KS_PASS" && test -n "$KEY_PASS" && test -n "$EXPECTED_CERT_SHA256"
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          PINNED=$(python3 -c 'import json;print(json.load(open("signing-baseline.json"))["certificateSha256"])')
          test "$EXPECTED" = "$PINNED"
          test "$PINNED" = 'd528e789425c8914d5034c98c00aff8b1f407fee4fdd5584683cbfe81218752c'
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KEY_PASS"
          mkdir -p "$RUNNER_TEMP/nah-signing"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/nah-signing/nah-original.p12"
          keytool -exportcert -keystore "$RUNNER_TEMP/nah-signing/nah-original.p12" -storetype PKCS12 -alias "$KS_ALIAS" -storepass "$KS_PASS" -file "$RUNNER_TEMP/nah-signing/original.der" >/dev/null
          ACTUAL=$(sha256sum "$RUNNER_TEMP/nah-signing/original.der" | cut -d' ' -f1)
          test "$ACTUAL" = "$PINNED"
          cmp "$RUNNER_TEMP/nah-signing/original.der" release-certificate.der
      - name: Install Android SDK and Gradle
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile release APK without modifying package ID
        run: gradle :app:assembleRelease --no-daemon
      - name: Align, sign and verify exact original signing certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$RUNNER_TEMP/nah-lab-aligned.apk"
          APK=publish/NAH-LabSuite-Android-v1.1.16-Web-v1.58.60-original-signer.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/nah-signing/nah-original.p12" --ks-type PKCS12 \
            --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$APK" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-verify.txt"
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          ACTUAL=$(grep -m 1 -F 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/apk-verify.txt" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          test "$EXPECTED" = "$ACTUAL"
          grep -q '^Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apk-verify.txt"
          sha256sum "$APK" > publish/SHA256SUMS.txt
          printf 'INTERNAL QA HOLD. Android v1.1.16 / Web v1.58.60. Original APK signing certificate preserved. Device test required before distribution.\n' > publish/README-HOLD.txt
          echo 'PASS: APK signed with exactly original Android v1.1.15 certificate'
      - uses: actions/upload-artifact@v4
        with:
          name: NAH-Android-v1.1.16-ORIGINAL-SIGNER-INTERNAL-HOLD
          path: publish/
          if-no-files-found: error
          retention-days: 14
      - name: Never retain private signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/nah-signing"

  windows-signed-internal-hold:
    runs-on: windows-latest
    needs: verify-web-and-native
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      WIN_PFX_B64: ${{ secrets.NAH_WINDOWS_PFX_B64 }}
      WIN_PFX_PASS: ${{ secrets.NAH_WINDOWS_PFX_PASSWORD }}
      WIN_THUMB: ${{ secrets.NAH_WINDOWS_CERT_THUMBPRINT }}
    steps:
      - name: Keep source bytes stable on Windows
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage pinned Web 1.58.60 and check native parity
        shell: pwsh
        run: |
          python -X utf8 tools/prepare-native-web15860.py
          if ($LASTEXITCODE -ne 0) { throw 'Source staging failed' }
          python -X utf8 tools/verify-native-parity.py
          if ($LASTEXITCODE -ne 0) { throw 'Native source parity failed' }
          node --check native/windows/offline/assets/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JS syntax invalid' }
      - name: Verify pre-existing internal signing identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (-not $env:WIN_PFX_B64 -or -not $env:WIN_PFX_PASS -or -not $env:WIN_THUMB) { throw 'HOLD: Windows signer secrets missing' }
          $meta=Get-Content 'native/windows/signer-baseline.json' -Raw | ConvertFrom-Json
          if ($meta.certificateThumbprintSha1 -ne $env:WIN_THUMB.ToUpperInvariant()) { throw 'HOLD: signer mismatch' }
          if ($meta.publiclyTrusted -ne $false -or $meta.releaseReady -ne $false) { throw 'HOLD: publication gate altered' }
      - name: Discover LLVM build tools
        shell: pwsh
        run: |
          $llvm='C:\Program Files\LLVM\bin'
          if (-not (Get-Command clang.exe -ErrorAction SilentlyContinue)) {
            if (Test-Path (Join-Path $llvm 'clang.exe')) { $env:PATH="$llvm;$env:PATH"; $llvm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }
          if (-not (Get-Command clang.exe -ErrorAction SilentlyContinue)) { throw 'Missing clang' }
          if (-not (Get-Command lld-link.exe -ErrorAction SilentlyContinue)) { throw 'Missing lld-link' }
      - name: Build Native Windows 1.3.29 x64
        shell: cmd
        working-directory: native/windows
        run: BUILD-X64.cmd
      - name: Sign binary and updater with the original Windows certificate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pfx=Join-Path $env:RUNNER_TEMP 'nah-windows-original.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:WIN_PFX_B64))
            $cert=Import-PfxCertificate -FilePath $pfx -Password (ConvertTo-SecureString $env:WIN_PFX_PASS -AsPlainText -Force) -CertStoreLocation Cert:\CurrentUser\My
            if ($cert.Thumbprint -ne $env:WIN_THUMB.ToUpperInvariant()) { throw 'Wrong Windows signer' }
            $tool=Get-ChildItem -Path (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin') -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1 -ExpandProperty FullName
            if (-not $tool) { throw 'Missing signtool' }
            $exe=Join-Path $PWD 'native/windows/NAH-LAB-SUITE.exe'
            & $tool sign /fd SHA256 /sha1 $env:WIN_THUMB /s My /tr 'http://timestamp.digicert.com' /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw 'Windows signing failed' }
            $sig=Get-AuthenticodeSignature -FilePath $exe
            if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -ne $env:WIN_THUMB.ToUpperInvariant()) { throw 'EXE certificate mismatch' }
            $f=Join-Path $PWD 'native/windows/NAH-UPDATE.ps1'
            $scriptSig=Set-AuthenticodeSignature -FilePath $f -Certificate $cert -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
            if (-not $scriptSig.SignerCertificate -or $scriptSig.SignerCertificate.Thumbprint -ne $env:WIN_THUMB.ToUpperInvariant()) { throw 'Updater signer mismatch' }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            if ($env:WIN_THUMB) { Remove-Item ("Cert:\CurrentUser\My\" + $env:WIN_THUMB) -Force -ErrorAction SilentlyContinue }
          }
      - name: Package signed Windows candidate without touching WebView2 user data
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $PWD 'native/windows'
          $dst=Join-Path $PWD 'publish/NAH-LabSuite-Windows-v1.3.29'
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          foreach ($n in @('NAH-LAB-SUITE.exe','NAH-UPDATE.ps1','NAH-UPDATE.cmd','INSTALL-OR-UPDATE.ps1','INSTALL-OR-UPDATE.cmd','signer-baseline.json','public-internal-codesign.crt')) {
            $p=Join-Path $src $n
            if (-not (Test-Path $p)) { throw "Missing $n" }
            Copy-Item -LiteralPath $p -Destination $dst
          }
          Copy-Item -LiteralPath (Join-Path $src 'offline') -Destination $dst -Recurse
          $version=[Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $dst 'NAH-LAB-SUITE.exe')).FileVersion
          if ($version -notmatch '^1\.3\.29(?:\.0)?$') { throw "Incorrect Windows binary version: $version" }
          'INTERNAL-SIGNED ONLY; WEB 1.58.60; NOT PUBLICLY TRUSTED; DO NOT ENABLE AUTO-UPDATE. Test WebView2, login and offline mirror on Windows 10/11. Existing per-user data is not part of this archive.' | Set-Content (Join-Path $dst 'README-HOLD.txt') -Encoding UTF8
          $sha=@(Get-ChildItem $dst -Recurse -File | ForEach-Object { [pscustomobject]@{name=$_.FullName.Substring($dst.Length+1).Replace('\','/');sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} })
          $sha | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $dst 'SHA256-FILES.json') -Encoding UTF8
          $zip='publish/NAH-LabSuite-Windows-v1.3.29-Web-v1.58.60-ORIGINAL-SIGNER-HOLD.zip'
          Compress-Archive -Path $dst -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-FileHash $zip -Algorithm SHA256 | Format-List | Out-File 'publish/ZIP-SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: NAH-Windows-v1.3.29-ORIGINAL-SIGNER-INTERNAL-HOLD
          path: publish/
          if-no-files-found: error
          retention-days: 14
