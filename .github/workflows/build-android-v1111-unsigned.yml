name: Build NAH ISO Android 1.1.11 unsigned for local baseline signing
on:
  push:
    branches:
      - android-v1.1.11-web-v1.58.29-local-sign
    paths:
      - "ci/parts/**"
      - ".github/workflows/build-android-v1111-unsigned.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Assemble source from immutable archive parts
        shell: bash
        run: |
          set -euo pipefail
          cat ci/parts/part-*.txt | base64 -d > /tmp/nah-source.zip
          unzip -t /tmp/nah-source.zip | tail -1
          unzip -q /tmp/nah-source.zip -d /tmp/nah-source
          cp -a /tmp/nah-source/. ./
          grep -q "versionName '1.1.11'" app/build.gradle
          grep -q "versionCode 11011" app/build.gradle
          grep -q 'android-v1.1.11-web-v1.58.29' app/src/main/java/vn/nah/iso15189suite/MainActivity.java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build unsigned APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Gather build and signing tools without any private signing keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tools
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" out/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" out/tools/
          if [ -f "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++_shared.so" ]; then cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++_shared.so" out/tools/; fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/app-release-unsigned.apk > out/aapt-badging.txt
          sha256sum out/app-release-unsigned.apk > out/unsigned-sha256.txt
          grep -q "package: name='vn.nah.iso15189suite'" out/aapt-badging.txt
          grep -q "versionCode='11011'" out/aapt-badging.txt
          grep -q "versionName='1.1.11'" out/aapt-badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nah-iso-android-v1.1.11-unsigned-and-sign-tools
          path: out/
          if-no-files-found: error
          retention-days: 7
